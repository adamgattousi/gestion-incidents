name: CD

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter les tests
        run: pytest -v

  publication:
    # ce job ne démarre que si les tests ont réussi
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      # GHCR accepte seulement des noms en minuscules
      - name: Définir le nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gestion-incidents" >> $GITHUB_ENV

      - name: Construire l'image Docker
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image dans GHCR
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
